# ============================================================
#  生产部署 Compose
#  前后端使用 CI 构建并推送到 GHCR 的镜像，服务器只需 pull，不现场构建。
#  配合 .github/workflows/deploy.yml 使用。
#
#  服务器上手动操作：
#    export IMAGE_TAG=latest            # 回滚时可指定某次提交的 git sha
#    docker compose -f docker-compose.prod.yml pull
#    docker compose -f docker-compose.prod.yml up -d
#
#  与开发用 docker-compose.yml 的区别：
#    - backend/frontend 用 image 而非 build
#    - 仅 nginx 对外暴露 80/443；mysql/backend/frontend 只在内网互通
# ============================================================

services:
  mysql:
    image: mysql:8.0
    container_name: personal-site-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?请在 .env 中配置 DB_PASSWORD}
      MYSQL_DATABASE: personal_site
      MYSQL_USER: ${DB_USER:-admin}
      MYSQL_PASSWORD: ${DB_PASSWORD:?请在 .env 中配置 DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      # schema 已改由后端 Flyway 迁移管理（db/migration），不再用 initdb 脚本建表
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: always

  backend:
    image: ghcr.io/liu-gaoleng/isme-backend:${IMAGE_TAG:-latest}
    container_name: personal-site-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/personal_site?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-admin}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?请在 .env 中配置 DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?请在 .env 中配置一个 32+ 字符的强随机 JWT_SECRET}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-https://liuxxs.com,https://www.liuxxs.com}
    depends_on:
      mysql:
        condition: service_healthy
    restart: always

  frontend:
    # 注意：NEXT_PUBLIC_API_URL 在镜像构建阶段已写死（见 deploy.yml 的 build-args），
    # 这里无需再传。
    image: ghcr.io/liu-gaoleng/isme-frontend:${IMAGE_TAG:-latest}
    container_name: personal-site-frontend
    depends_on:
      - backend
    restart: always

  nginx:
    image: nginx:alpine
    container_name: personal-site-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./certificates:/etc/nginx/certificates
    depends_on:
      - frontend
      - backend
    restart: always

volumes:
  mysql_data:
