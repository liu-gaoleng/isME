events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 优化大文件传输
    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 50M;

    # gzip 压缩，加速访问
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/json application/javascript application/x-javascript application/xml;

    upstream backend {
        server backend:8080;
    }

    upstream frontend {
        server frontend:3000;
    }

    # HTTP -> HTTPS 强制跳转
    server {
        listen 80;
        server_name liuxxs.com www.liuxxs.com;

        # Let's Encrypt 校验文件路径（如果以后用 LE 续期可用，目前可保留无影响）
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # 其它所有请求 301 跳转到 HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS 主服务
    server {
        listen 443 ssl;
        http2 on;
        server_name liuxxs.com www.liuxxs.com;

        # SSL 证书路径
        ssl_certificate     /etc/nginx/certificates/liuxxs.com_bundle.crt;
        ssl_certificate_key /etc/nginx/certificates/liuxxs.com.key;

        # SSL 协议与加密套件优化
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_session_tickets off;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        # HSTS（强制浏览器走 HTTPS，半年内）
        add_header Strict-Transport-Security "max-age=15768000; includeSubDomains" always;

        # 后端 API
        location /api/ {
            proxy_pass http://backend/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 后端上传的图片静态资源
        location /uploads/ {
            proxy_pass http://backend/uploads/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 前端 Next.js
        location / {
            proxy_pass http://frontend/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
