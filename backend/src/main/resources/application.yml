server:
  port: 8080

spring:
  application:
    name: personal-site-backend

  # 文件上传大小限制（单文件 5MB，与 UploadController 的校验保持一致）
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  # 敏感配置一律通过环境变量注入（见 docker-compose.yml / .env）。
  # 冒号后的默认值仅用于本地开发，生产环境必须由环境变量覆盖。
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/personal_site?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # schema 改由 Flyway 管理；Hibernate 仅校验实体与表结构是否一致（不再自动改表）
      ddl-auto: validate
    # 关闭 Open Session In View，避免在 view 渲染期间触发数据库查询，
    # 强制所有 LAZY 关联在 Service 层（@Transactional）内显式加载。
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  # 数据库版本化迁移：启动时自动执行 classpath:db/migration 下的 V*.sql
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 对已有数据但尚无 flyway 历史表的库做基线，避免首次接入时报错。
    # 注意：若库里已存在同名表（来自旧的 ddl-auto/initdb），需先清库或手动 baseline 到 V1。
    baseline-on-migrate: true

jwt:
  # 绝不要把真实密钥提交进仓库。本地无环境变量时用下面的开发占位密钥（仅供本地启动）。
  secret: ${JWT_SECRET:dev-only-insecure-secret-key-change-me-in-production-32+}
  expiration: ${JWT_EXPIRATION:86400000}

app:
  # 上传文件存储目录。生产环境通过 APP_UPLOAD_DIR 指向挂载的持久化卷（见 docker-compose.prod.yml）。
  upload:
    dir: ${APP_UPLOAD_DIR:uploads}
  cors:
    # 允许跨域访问的前端来源，逗号分隔。生产用 APP_CORS_ALLOWED_ORIGINS 注入真实域名。
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  # 启动时自动创建的初始管理员账户。生产环境必须通过环境变量覆盖以下三项。
  admin:
    username: ${ADMIN_USERNAME:admin}
    email: ${ADMIN_EMAIL:admin@example.com}
    password: ${ADMIN_PASSWORD:admin123}
