name: CI

# 质量门禁：每次推送 / PR 到 main 时，验证前后端能否构建通过。
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# 同一分支的新提交会取消上一次仍在跑的 CI，省额度。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端 · 构建与测试 (JDK 17)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      # 必须锁 JDK 17：Lombok 1.18.32 不支持过新的 JDK（见项目 README）
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: 构建并运行测试
        run: mvn -B -ntp clean verify

  frontend:
    name: 前端 · Lint 与构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: 安装依赖
        run: npm ci

      # 现存 4 个 lint error（React 19 set-state-in-effect 等）待阶段 3 修复，
      # 修完后请删除 continue-on-error，让 lint 成为硬门禁。
      - name: Lint（暂不阻塞）
        run: npm run lint
        continue-on-error: true

      - name: 构建
        run: npm run build
        env:
          # 构建期注入占位 API 地址，next build 时 NEXT_PUBLIC_* 会被写死
          NEXT_PUBLIC_API_URL: http://localhost:8080
