name: Deploy

# 推送到 main（或手动触发）时：构建前后端镜像推送到阿里云 ACR，再 SSH 到服务器拉取重启。
# 切到 ACR 是因为服务器在国内（腾讯云轻量），跨境拉 GHCR 速度极慢/不稳定。
on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  # 镜像完整地址 = <ACR_REGISTRY>/<ACR_NAMESPACE>/<repo>
  IMAGE_BACKEND: ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/isme-backend
  IMAGE_FRONTEND: ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/isme-frontend
  # 让 JS-based actions 运行在 Node 24，消除 Node 20 弃用警告
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  build-and-push:
    name: 构建并推送镜像到阿里云 ACR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录阿里云 ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: 构建并推送后端镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          # 阿里云 ACR 不认 buildx 默认附带的 OCI attestation 清单
          # （报 unknown manifest class ...oci.empty.v1+json），必须关掉
          provenance: false
          sbom: false
          tags: |
            ${{ env.IMAGE_BACKEND }}:latest
            ${{ env.IMAGE_BACKEND }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 构建并推送前端镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          provenance: false
          sbom: false
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.PROD_API_URL || 'https://liuxxs.com' }}
          tags: |
            ${{ env.IMAGE_FRONTEND }}:latest
            ${{ env.IMAGE_FRONTEND }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: SSH 部署到服务器
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: 通过 SSH 拉取最新镜像并重启
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          # 国内拉 ACR 一般很快，但保留较大超时以防万一
          command_timeout: 20m
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"
            # 拉取最新的 compose / nginx 配置等（镜像不在仓库里，仅配置文件）
            git pull --ff-only

            # 登录阿里云 ACR 拉取私有镜像
            echo "${{ secrets.ACR_PASSWORD }}" | docker login "${{ secrets.ACR_REGISTRY }}" -u "${{ secrets.ACR_USERNAME }}" --password-stdin

            # 用本次提交的 sha 作为镜像标签，保证拉到的就是刚构建的版本
            export IMAGE_TAG="${{ github.sha }}"
            export ACR_REGISTRY="${{ secrets.ACR_REGISTRY }}"
            export ACR_NAMESPACE="${{ secrets.ACR_NAMESPACE }}"

            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            # 清理悬空镜像，释放磁盘
            docker image prune -f
            docker logout "${{ secrets.ACR_REGISTRY }}"
