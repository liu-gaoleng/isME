name: Deploy

# 推送到 main（或手动触发）时：构建前后端镜像推送到 GHCR，再 SSH 到服务器拉取重启。
on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  IMAGE_BACKEND: ghcr.io/${{ github.repository_owner }}/isme-backend
  IMAGE_FRONTEND: ghcr.io/${{ github.repository_owner }}/isme-frontend
  # 让 JS-based actions 运行在 Node 24，消除 Node 20 弃用警告
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  build-and-push:
    name: 构建并推送镜像到 GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送后端镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BACKEND }}:latest
            ${{ env.IMAGE_BACKEND }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 构建并推送前端镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.PROD_API_URL || 'https://liuxxs.com' }}
          tags: |
            ${{ env.IMAGE_FRONTEND }}:latest
            ${{ env.IMAGE_FRONTEND }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: SSH 部署到服务器
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: 通过 SSH 拉取最新镜像并重启
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          # 服务器拉取 GHCR 镜像可能较慢，放宽命令超时（默认仅 10m），避免大层下载被中断
          command_timeout: 30m
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"
            # 拉取最新的 compose / nginx 配置等（镜像不在仓库里，仅配置文件）
            git pull --ff-only
            # 登录 GHCR 以拉取私有镜像（GITHUB_TOKEN 仅在本次部署期间有效）
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            # 用本次提交的 sha 作为镜像标签，保证拉到的就是刚构建的版本
            export IMAGE_TAG="${{ github.sha }}"
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            # 清理悬空镜像，释放磁盘
            docker image prune -f
            docker logout ghcr.io
